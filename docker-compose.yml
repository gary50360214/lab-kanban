version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: lab_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:15432:5432"

    networks:
      - lab_network


  backend:
    build: ./backend

    container_name: lab_backend

    restart: always

    depends_on:
      - postgres

    environment:

      DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AUTH_USERNAME: ${AUTH_USERNAME}

      AUTH_PASSWORD_HASH: $$argon2id$$v=19$$m=65536,t=3,p=4$$X6z4n2Gp8G7iV+EQQEhoCA$$vHd4g9OLrMQGbfwwG64vaxEZeJlHLtsQIjwKOTmH5K0

      AUTH_SESSION_IDLE_DAYS: ${AUTH_SESSION_IDLE_DAYS}

      AUTH_SESSION_REFRESH_SECONDS: ${AUTH_SESSION_REFRESH_SECONDS}

      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}

      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "127.0.0.1:18088:8000"

    networks:
      - lab_network


  frontend:
    build: ./frontend

    container_name: lab_frontend

    restart: always

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "18080:5173"

    networks:
      - lab_network


  nginx:
    image: nginx:latest
    container_name: lab_nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

    networks:
      - lab_network


volumes:

  postgres_data:


networks:

  lab_network: